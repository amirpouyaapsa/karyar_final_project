<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3; url=products.html">
    <title>بازارینو | فروشگاه اینترنتی</title>
    <style>
        @font-face {
            font-family: "MyVazirmatn";
            src: url("font/Vazirmatn[wght].woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        * {
            box-sizing: border-box;
            font-family: "MyVazirmatn", sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F8FAFC;
            color: #14213D;
            font-family: Tahoma, sans-serif;
        }
        .loading {
            text-align: center;
        }
        h1 {
            color: #0F766E;
            margin-bottom: 16px;
        }
        p {
            font-size: 16px;
        }
        .spinner {
            width: 42px;
            height: 42px;
            margin: 24px auto;
            border: 4px solid #E5E7EB;
            border-top-color: #0F766E;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        a {
            color: #1e998f;
        }
    </style>
</head>
<body>
    <main class="loading">
        <h1>بازارینو</h1>
        <div class="spinner" aria-hidden="true"></div>
        <p>در حال انتقال به فروشگاه...</p>
        <p>
            اگر انتقال انجام نشد،
            <a href="products.html">اینجا کلیک کنید</a>.
        </p>
    </main>
</body>
</html>
